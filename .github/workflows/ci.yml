name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy buildscope apps tests

      - name: Configure C++ worker
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ worker
        run: cmake --build build/ci --parallel

      - name: CTest
        run: ctest --test-dir build/ci --output-on-failure

      - name: Release preflight
        run: python -m buildscope.release preflight

      - name: Dashboard JavaScript syntax
        run: node --check apps/api/static/dashboard/app.js

      - name: Pytest
        env:
          BUILDSCOPE_CPP_WORKER: build/ci/cpp-worker/buildscope_cpp_worker
          BUILDSCOPE_REQUIRE_CPP_WORKER: "1"
        run: pytest -q -rs

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --sdist --outdir dist

      - name: Install wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv clean-env
          clean-env/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl

      - name: Smoke test installed package
        working-directory: ${{ runner.temp }}
        run: |
          clean-env/bin/buildscope --help
          clean-env/bin/buildscope serve \
            --port 8765 \
            --database "$RUNNER_TEMP/smoke.db" > serve.log 2>&1 &

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:8765/health
          curl -sf http://127.0.0.1:8765/health/ready
          curl -sf http://127.0.0.1:8765/dashboard | grep -q '<title>BuildScope</title>'
          curl -sf http://127.0.0.1:8765/dashboard/assets/app.js > /dev/null
          curl -sf http://127.0.0.1:8765/dashboard/api/overview

      - name: Show server log on failure
        if: failure()
        working-directory: ${{ runner.temp }}
        run: cat serve.log

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve runtime and development dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/python" -m pip install ".[dev]"
          "$RUNNER_TEMP/audit-env/bin/python" -m pip freeze \
            --exclude buildscope-ai > requirements-audit.txt

      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit \
            --requirement requirements-audit.txt \
            --no-deps \
            --disable-pip \
            --strict

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks

      - name: Scan every commit on every ref
        run: ./gitleaks git --log-opts="--all" --redact --verbose .

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: No private files tracked
        run: |
          python - <<'PY'
          import subprocess
          import sys

          sys.path.insert(0, ".")
          from buildscope.release.preflight import is_private_path

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, text=True, check=True
          ).stdout.split("\0")
          private = [path for path in tracked if path and is_private_path(path)]

          if private:
              sys.exit(f"Private files are tracked: {private}")

          print(f"Checked {len([p for p in tracked if p])} tracked files")
          PY
