name: Python Quality

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Mypy
        run: |
          mypy buildscope
          mypy tests

      - name: Pytest
        run: |
          pytest
