name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: tag matches project version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refuse a tag that differs from pyproject.toml
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]

          if tag != f"v{version}":
              sys.exit(f"Tag {tag} does not match project.version {version}")

          print(f"{tag} matches project.version")
          PY

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: build, verify and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --sdist --outdir dist

      - name: Preflight against the built wheel
        run: |
          python -m pip install -e .
          python -m buildscope.release preflight \
            --tag "$GITHUB_REF_NAME" \
            --wheel dist/*.whl

      - name: Install the wheel outside the source tree and smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv release-env
          release-env/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          release-env/bin/buildscope --version
          release-env/bin/buildscope serve --port 8765 \
            --database "$RUNNER_TEMP/release.db" > serve.log 2>&1 &

          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:8765/health/ready
          curl -sf http://127.0.0.1:8765/dashboard > /dev/null

      - name: Write checksums and release notes
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cd ..
          python -m buildscope.release notes > "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "BuildScope ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
