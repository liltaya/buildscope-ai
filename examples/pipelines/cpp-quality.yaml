name: cpp-quality-pipeline

stages:
  - name: configure
    command: [cmake, -S, ., -B, build]
    timeout_seconds: 120

  - name: build
    command: [cmake, --build, build]
    depends_on: [configure]
    timeout_seconds: 300

  - name: tests
    command: [
      ctest,
      --test-dir,
      build,
      --output-on-failure
    ]
    depends_on: [build]
    timeout_seconds: 300
    retry_count: 1
    test_report: ctest
