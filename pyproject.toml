[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "buildscope-ai"
version = "0.1.0"
description = "Local software delivery and reliability intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Taya Mamenko" },
]
keywords = ["ci", "pipelines", "flaky-tests", "benchmarks", "regressions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30",
    "defusedxml>=0.7.1,<1.0",
    "scikit-learn>=1.6,<2.0",
    "joblib>=1.4,<2.0",
    "alembic>=1.13,<2.0",
    "numpy>=1.26,<3.0",
]

[project.urls]
Homepage = "https://github.com/liltaya/buildscope-ai"
Source = "https://github.com/liltaya/buildscope-ai"
Issues = "https://github.com/liltaya/buildscope-ai/issues"
Changelog = "https://github.com/liltaya/buildscope-ai/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff==0.17.4",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-defusedxml>=0.7",
]


[project.scripts]
buildscope = "buildscope.__main__:main"


[tool.setuptools.packages.find]
include = [
    "buildscope*",
    "apps*",
]

[tool.setuptools.package-data]
buildscope = ["py.typed"]
"apps.api" = ["static/dashboard/*"]


# --------------------------------------------------
# Mypy configuration
# --------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
check_untyped_defs = true


# Third-party ML dependencies do not provide complete
# typing information. Suppress import-untyped for these
# packages without disabling checks in project code.

[[tool.mypy.overrides]]
module = [
    "joblib",
    "joblib.*",
    "sklearn",
    "sklearn.*",
]
follow_untyped_imports = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
[tool.ruff.lint.isort]
known-first-party = ["apps", "buildscope"]
