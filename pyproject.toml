[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "buildscope-ai"
version = "0.1.0"
description = "Local software delivery and reliability intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",

]


[project.scripts]
buildscope = "buildscope.__main__:main"


[tool.setuptools.packages.find]
include = [
    "buildscope*",
    "apps*",
]


[tool.setuptools.package-data]
buildscope = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true


[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
